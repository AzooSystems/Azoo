name: build-and-publish-module

on:
  push:
    tags:
      - "v**"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build module artifact (staging)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")

          # -----------------------------
          # Parse SemVer using built-in .NET type (preferred over regex)
          # -----------------------------
          try {
              $semver = [System.Management.Automation.SemanticVersion]::Parse($tag)
          }
          catch {
              throw "Invalid SemVer tag: $tag"
          }

          $major = $semver.Major
          $minor = $semver.Minor
          $patch = $semver.Patch

          # IMPORTANT: store prerelease state
          $isPrerelease = -not [string]::IsNullOrWhiteSpace($semver.PreReleaseLabel)
          $prereleaseLabel = $semver.PreReleaseLabel

          $moduleVersion = "$major.$minor.$patch"

          "IS_PRERELEASE=$isPrerelease" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PRERELEASE_LABEL=$prereleaseLabel" | Out-File -FilePath $env:GITHUB_ENV -Append

          # Clean staging folder
          Remove-Item ./dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path ./dist/Azoo -Force | Out-Null

          # Copy source into staging
          Copy-Item ./src/Azoo/* ./dist/Azoo -Recurse

          $manifestPath = "./dist/Azoo/Azoo.psd1"
          
          $params = @{
              Path          = $manifestPath
              ModuleVersion = $moduleVersion
          }

          if ($isPrerelease) {
              $params.Prerelease = $prereleaseLabel
          }

          # Update module manifest
          Update-PsModuleManifest @params

      - name: Package module (.nupkg)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./artifacts -Force | Out-Null
          $packagePath = Compress-PSResource -PassThru `
            -Path ./dist/Azoo `
            -DestinationPath "./artifacts"

          echo "PACKAGE_PATH=$packagePath" | Out-File -FilePath $env:GITHUB_ENV -Append
      
      - name: Generate artifact attestation (stable only)
        if: env.IS_PRERELEASE == 'False'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ env.PACKAGE_PATH }}

      - name: Setup repository
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $secure = ConvertTo-SecureString $env:GITHUB_TOKEN -AsPlainText -Force

          $cred = New-Object Microsoft.PowerShell.PSResourceGet.UtilClasses.PSCredentialInfo(
            "AzooSystems",
            $secure
          )

          Register-PSResourceRepository `
            -Name "GitHub" `
            -Uri "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            -Trusted `
            -Credential $cred

      - name: Publish to GitHub Packages
        shell: pwsh
        run: |
          Publish-PSResource `
            -Path $env:PACKAGE_PATH `
            -Repository GitHub
