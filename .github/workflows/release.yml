name: build-and-publish-module

on:
  push:
    tags:
      - "v**"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  publish:
    needs: version
    # Immutable releases but copilot will moan and whine about tag usage
    uses: AzooSystems/AzooBuilder/.github/workflows/build-and-release-ps-module.yml@5f872139e68612793e04f7b561ef6c37a23209ff # 26.09.27
    with:
      version: ${{ needs.version.outputs.version }}
      moduleName: Azoo
      modulePath: ./src/Azoo
      publishToGitHubPackagesNuGetFeed: true
      gitHubPackagesNuGetFeedOrganizationName: AzooSystems
      gitHubPackagesNuGetFeedRepositoryName: GitHub
      gitHubPackagesNuGetFeedUri: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      publishToGitHubContainerRegistry: true
      publishToPowerShellGallery: true
      publishToGitHubRelease: true

    secrets:
      githubToken: ${{ secrets.GITHUB_TOKEN }}
      galleryApiKey: ${{ secrets.GALLERY_API_KEY }}
      gitHubReleaseToken: ${{ secrets.GITHUB_TOKEN }}
