name: build-and-publish-module

on:
  push:
    tags:
      - "v**"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  publish:
    needs: version
    # Immutable releases but copilot will moan and whine about tag usage
    uses: AzooSystems/AzooBuilder/.github/workflows/build-and-release-ps-module.yml@b4c12fc6836495e9b5b95d863d88463d83997c24 # 26.09.27.1
    with:
      version: ${{ needs.version.outputs.version }}
      moduleName: Azoo
      modulePath: ./src/Azoo
      publishToGitHubPackagesNuGetFeed: true
      gitHubPackagesNuGetFeedOrganizationName: AzooSystems
      gitHubPackagesNuGetFeedRepositoryName: GitHub
      gitHubPackagesNuGetFeedUri: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      publishToGitHubContainerRegistry: true
      publishToPowerShellGallery: true
      publishToGitHubRelease: true

    secrets:
      gitHubPackagesNuGetFeedToken: ${{ secrets.GITHUB_TOKEN }}
      galleryApiKey: ${{ secrets.GALLERY_API_KEY }}
      gitHubContainerRegistryToken: ${{ secrets.GITHUB_TOKEN }}
      gitHubReleaseToken: ${{ secrets.GITHUB_TOKEN }}
